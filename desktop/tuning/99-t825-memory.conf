# Low-RAM tuning for swap on zram (Galaxy Tab S3, 3.5 GiB usable).
# Swapping to zram is much cheaper than dropping page cache and rereading eMMC, so prefer it.
vm.swappiness = 180
# zram has no seek cost: read one page per fault instead of 8.
vm.page-cluster = 0
# Start background reclaim earlier and avoid boost bursts (ChromeOS/Fedora values).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
